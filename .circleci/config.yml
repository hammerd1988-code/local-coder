version: 2.1

# Orbs for easier configuration
orbs:
  node: circleci/node@5.1.0
  docker: circleci/docker@2.4.0

# Reusable executors
executors:
  node-executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project

# Reusable commands
commands:
  install-dependencies:
    description: "Install npm dependencies with caching"
    steps:
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}

# Jobs
jobs:
  lint-and-typecheck:
    executor: node-executor
    steps:
      - checkout
      - install-dependencies
      - run:
          name: TypeScript type check
          command: |
            npx tsc --noEmit
            npx tsc --project tsconfig.server.json --noEmit
      - run:
          name: Code quality check
          command: echo "Code quality check completed"

  test:
    executor: node-executor
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Run tests
          command: |
            echo "Running tests..."
            # npm test
      - run:
          name: Generate coverage
          command: |
            echo "Generating coverage..."
            # npm run test:coverage
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage

  build:
    executor: node-executor
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Build application
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - server
      - store_artifacts:
          path: dist

  build-docker:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - docker/check
      - docker/build:
          image: $DOCKER_LOGIN/$CIRCLE_PROJECT_REPONAME
          tag: $CIRCLE_SHA1,latest
      - docker/push:
          image: $DOCKER_LOGIN/$CIRCLE_PROJECT_REPONAME
          tag: $CIRCLE_SHA1,latest

  deploy-staging:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Deploy to staging
          command: |
            echo "Deploying to staging environment..."
            # Add deployment commands here

  deploy-production:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Deploy to production
          command: |
            echo "Deploying to production environment..."
            # Add deployment commands here
      - run:
          name: Run smoke tests
          command: |
            echo "Running smoke tests..."
            # ./scripts/health-check.sh $PRODUCTION_URL

# Workflows
workflows:
  version: 2
  
  # Main CI workflow
  ci:
    jobs:
      - lint-and-typecheck
      - test:
          requires:
            - lint-and-typecheck
      - build:
          requires:
            - lint-and-typecheck
      - build-docker:
          requires:
            - test
            - build
          filters:
            branches:
              only:
                - main
                - develop

  # Deployment workflow
  deploy:
    jobs:
      - deploy-staging:
          filters:
            branches:
              only: develop
          requires:
            - build-docker
      - hold-production:
          type: approval
          filters:
            branches:
              only: main
      - deploy-production:
          requires:
            - hold-production
          filters:
            branches:
              only: main
