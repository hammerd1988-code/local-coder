name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set deployment variables
        id: vars
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
            echo "deploy_url=${{ secrets.STAGING_DEPLOY_URL }}" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          else
            echo "deploy_url=${{ secrets.PRODUCTION_DEPLOY_URL }}" >> $GITHUB_OUTPUT
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          fi
      
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Deploy to Kubernetes (example)
        run: |
          echo "Deploying to ${{ steps.vars.outputs.deploy_env }}..."
          # Add your deployment commands here
          # kubectl apply -f k8s/deployment.yml
          # kubectl set image deployment/app app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # kubectl rollout status deployment/app
      
      - name: Deploy via Docker Compose (example)
        run: |
          echo "Alternative: Deploy using docker-compose"
          # docker-compose -f docker-compose.prod.yml pull
          # docker-compose -f docker-compose.prod.yml up -d
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke tests here
          # curl -f ${{ steps.vars.outputs.deploy_url }}/api/health || exit 1
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment to ${{ steps.vars.outputs.deploy_env }} completed"
          # Add notification logic (Slack, Discord, email, etc.)

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back deployment..."
          # kubectl rollout undo deployment/app
          # docker-compose -f docker-compose.prod.yml down
          # docker-compose -f docker-compose.prod.yml up -d --scale app=0
