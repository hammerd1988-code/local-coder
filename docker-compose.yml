version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-coder
    ports:
      # Loopback only: the integrated terminal is an unauthenticated shell and
      # must not be reachable from the LAN
      - "127.0.0.1:4000:4000"
    volumes:
      # Persistent data directory
      - ./data:/app/data
      # Mount source code for development
      - ./client:/app/client
      - ./server:/app/server
      - ./scripts:/app/scripts
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIRECTORY=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: local-coder-dev
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATA_DIRECTORY=/app/data
    command: npm start
    restart: unless-stopped
    profiles:
      - dev

volumes:
  node_modules:
