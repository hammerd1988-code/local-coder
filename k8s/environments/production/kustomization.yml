apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

bases:
  - ../../

namePrefix: prod-

commonLabels:
  environment: production

patchesStrategicMerge:
  - deployment-patch.yml

images:
  - name: ghcr.io/your-username/local-coder
    newTag: latest

configMapGenerator:
  - name: local-coder-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - ENVIRONMENT=production

replicas:
  - name: local-coder
    count: 3
