apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
  - ../../

namePrefix: staging-

commonLabels:
  environment: staging

patchesStrategicMerge:
  - deployment-patch.yml

images:
  - name: ghcr.io/your-username/local-coder
    newTag: staging-latest

configMapGenerator:
  - name: local-coder-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - ENVIRONMENT=staging

replicas:
  - name: local-coder
    count: 1
