apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-coder-network-policy
  labels:
    app: local-coder
spec:
  podSelector:
    matchLabels:
      app: local-coder
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 4000
  
  # Allow traffic from same namespace (pod-to-pod)
  - from:
    - podSelector:
        matchLabels:
          app: local-coder
    ports:
    - protocol: TCP
      port: 4000
  
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS for external APIs
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  
  # Allow HTTP for external APIs
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 80
