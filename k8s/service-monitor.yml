# Prometheus ServiceMonitor (requires Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: local-coder
  labels:
    app: local-coder
    release: prometheus
spec:
  selector:
    matchLabels:
      app: local-coder
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    scheme: http
---
# PodMonitor (alternative to ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: local-coder
  labels:
    app: local-coder
    release: prometheus
spec:
  selector:
    matchLabels:
      app: local-coder
  podMetricsEndpoints:
  - port: http
    interval: 30s
    path: /metrics
---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: local-coder-alerts
  labels:
    app: local-coder
    release: prometheus
spec:
  groups:
  - name: local-coder
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: |
        sum(rate(local_coder_http_requests_total{status_code=~"5.."}[5m])) 
        / 
        sum(rate(local_coder_http_requests_total[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "Error rate is above 5% (current value: {{ $value | humanizePercentage }})"
    
    - alert: HighResponseTime
      expr: |
        histogram_quantile(0.95, 
          sum(rate(local_coder_http_request_duration_seconds_bucket[5m])) by (le)
        ) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High response time detected"
        description: "95th percentile response time is above 1s (current value: {{ $value }}s)"
    
    - alert: HighMemoryUsage
      expr: |
        (process_resident_memory_bytes / 1024 / 1024) > 400
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Memory usage is above 400MB (current value: {{ $value }}MB)"
    
    - alert: TerminalSessionsHigh
      expr: local_coder_terminal_sessions_active > 10
      for: 10m
      labels:
        severity: info
      annotations:
        summary: "High number of terminal sessions"
        description: "More than 10 active terminal sessions (current: {{ $value }})"
    
    - alert: GitOperationFailures
      expr: |
        sum(rate(local_coder_git_operations_total{status="error"}[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Git operations failing"
        description: "Git operations are failing at {{ $value }} per second"
