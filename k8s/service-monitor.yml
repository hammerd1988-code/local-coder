apiVersion: v1
kind: Service
metadata:
  name: local-coder-metrics
  labels:
    app: local-coder
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: local-coder
---
# Prometheus ServiceMonitor (requires Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: local-coder
  labels:
    app: local-coder
spec:
  selector:
    matchLabels:
      app: local-coder
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
